name: rewrite-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_PASSWORD: test-password, POSTGRES_DB: dtvp_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d dtvp_test" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: uv sync --locked --dev
      - run: uv run ruff check dtvp tests scripts
      - run: uv run pytest
        env: {DTVP_TEST_DATABASE_URL: 'postgresql+psycopg://postgres:test-password@127.0.0.1:5432/dtvp_test'}
      - run: npm ci --include=optional && npm run build && npm run test:unit
        working-directory: frontend
      - run: uv run python scripts/playground.py up
      - run: npx playwright install --with-deps chromium && npm run test:ui
        working-directory: frontend
      - run: git diff --check
      - if: always()
        run: uv run python scripts/playground.py down
