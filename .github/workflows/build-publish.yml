name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    if: github.event.action != 'closed'
    runs-on: node
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: uv sync --frozen
      - name: Prepare .env
        run: cp .env.test .env
      - name: Create dummy frontend assets
        run: |
          mkdir -p frontend/dist
          cp tests/assets/index.html frontend/dist/index.html
      - name: Run tests with coverage
        run: >-
          uv run pytest
          --junitxml=test-results/pytest-junit.xml
          --cov-report=json:test-results/coverage.json
      - name: Summarize results
        if: always()
        run: >-
          node scripts/ci-summary.mjs
          --title "Backend tests"
          --junit test-results/pytest-junit.xml
          --coverage-py test-results/coverage.json
          --resources "after tests"
      - name: Upload Python Coverage Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 30
      - name: Upload Python Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-test-results
          path: test-results/
          retention-days: 30

  test-frontend:
    if: github.event.action != 'closed'
    runs-on: node
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd frontend && npm ci --include=optional
      - name: Run unit tests with coverage
        working-directory: frontend
        run: >-
          npm run test:unit -- --run --coverage
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/vitest-junit.xml
      - name: Summarize results
        if: always()
        run: >-
          node scripts/ci-summary.mjs
          --title "Frontend unit tests"
          --junit frontend/test-results/vitest-junit.xml
          --coverage-istanbul frontend/coverage/coverage-summary.json
          --resources "after tests"
      - name: Upload Vitest Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: vitest-test-results
          path: frontend/test-results/
          retention-days: 30
      - name: Upload Vitest Coverage Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: vitest-coverage-report
          path: frontend/coverage/
          retention-days: 30

  test-e2e:
    if: github.event.action != 'closed'
    runs-on: node
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd frontend && npm ci --include=optional
      - name: Record runner resources
        run: node scripts/ci-summary.mjs --title "Browser tests" --resources "before tests"
      - name: Run E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npx playwright test --reporter=line,html,json
      - name: Summarize results
        if: always()
        run: >-
          node scripts/ci-summary.mjs
          --playwright frontend/test-results/results.json
          --resources "after tests"
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30

  check-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend, test-e2e]
    runs-on: node
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}
      tag_exists: ${{ steps.check_tag.outputs.TAG_EXISTS }}
    steps:
      - name: Install git
        run: |
          # Without git on PATH, checkout downloads a snapshot without history.
          if ! command -v git >/dev/null; then
            for i in {1..3}; do apt-get -qq update && break || sleep 5; done
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -qq -y git ca-certificates
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Extract Version
        id: get_version
        run: |
          DTVP_VERSION=$(uv version | awk '{print $2}')
          echo "VERSION=$DTVP_VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$DTVP_VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $DTVP_VERSION"
      - name: Check Git Tag
        id: check_tag
        run: |
          TAG=${{ steps.get_version.outputs.TAG }}
          VERSION=${{ steps.get_version.outputs.VERSION }}
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_DTVP_VERSION=$(git show "$TAG:pyproject.toml" | awk -F'"' '/^version = "/ {print $2; exit}')
            if [[ "$TAG_DTVP_VERSION" != "$VERSION" ]]; then
              echo "Git tag $TAG does not contain DTVP package version $VERSION." >&2
              echo "Tagged version: DTVP=$TAG_DTVP_VERSION; expected $VERSION." >&2
              exit 1
            fi
            echo "Git tag ${TAG} already exists — skipping release tag creation."
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

  create-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-version.outputs.tag_exists == 'false'
    needs: [check-version]
    runs-on: node
    steps:
      - name: Install git
        run: |
          # Without git on PATH, checkout downloads a snapshot without history.
          if ! command -v git >/dev/null; then
            for i in {1..3}; do apt-get -qq update && break || sleep 5; done
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -qq -y git ca-certificates
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RUNNER_PACKAGE_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.name "Gitea Actions"
          git config --global user.email "actions@gitea.io"
      - name: Create and push git tag
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

  build-push-images:
    if: github.event.action != 'closed' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [test-backend, test-frontend, test-e2e]
    runs-on: node
    steps:
      - name: Install git
        run: |
          # Without git on PATH, checkout downloads a snapshot without history.
          if ! command -v git >/dev/null; then
            for i in {1..3}; do apt-get -qq update && break || sleep 5; done
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -qq -y git ca-certificates
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RUNNER_PACKAGE_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Set up Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install Buildah
        run: |
          # Daemonless image builds: no Docker socket and no privileged mode.
          for i in {1..3}; do apt-get -qq update && break || sleep 5; done
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -qq -y buildah netavark ca-certificates
          buildah --version
          if ! unshare --user true 2>/dev/null; then
            echo "::error::User namespaces are blocked in this job container, so Buildah cannot run build steps. Start job containers with '--security-opt seccomp=unconfined' (and 'apparmor=unconfined' where AppArmor restricts user namespaces); see docs/deployment.md."
            exit 1
          fi
      - name: Generate Python CycloneDX SBOMs
        run: |
          mkdir -p sbom
          uv sync --frozen
          uv run --frozen cyclonedx-py environment \
            --short-PURLs \
            --output-reproducible \
            -o sbom/dtvp-backend-cyclonedx.json \
            --sv 1.6 \
            --mc-type application \
            --pyproject pyproject.toml

      - name: Generate Frontend CycloneDX SBOM (npm)
        run: |
          cd frontend
          npm exec --yes --package=@cyclonedx/cyclonedx-npm@6.0.1 -- cyclonedx-npm \
            --omit dev \
            --mc-type application \
            --output-reproducible \
            -o ../sbom/dtvp-frontend-cyclonedx.json \
            --ignore-npm-errors \
            --package-lock-only package.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dtvp-sbom
          path: sbom/*.json

      - name: Extract Version
        id: get_version
        run: |
          DTVP_VERSION=$(uv version | awk '{print $2}')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "$RELEASE_VERSION" != "$DTVP_VERSION" ]]; then
              echo "Release tag v$RELEASE_VERSION does not match packaged version $DTVP_VERSION." >&2
              exit 1
            fi
            VERSION="v$RELEASE_VERSION"
          else
            VERSION="v$DTVP_VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Generate CHANGELOG.md for Docker
        run: |
          uv run git-cliff -o CHANGELOG.md
      - name: Build and Push DTVP (free-threaded)
        env:
          REGISTRY: ${{ vars.RUNNER_PACKAGE_PUSH_HOST }}
          REGISTRY_USER: ${{ vars.RUNNER_PACKAGE_PUSH_USER }}
          REGISTRY_TOKEN: ${{ secrets.RUNNER_PACKAGE_PUSH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # vfs storage, chroot isolation and host networking are the modes
          # that work inside an unprivileged job container.
          buildah() { command buildah --storage-driver vfs "$@"; }
          repository="$REGISTRY/$REGISTRY_USER/dtvp"
          tags=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tags+=("pr-$PR_NUMBER")
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=("dev")
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("latest" "$VERSION")
          fi
          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "No image tag applies to $GITHUB_EVENT_NAME on $GITHUB_REF." >&2
            exit 1
          fi

          buildah build \
            --isolation chroot \
            --network host \
            --platform linux/amd64 \
            --file Dockerfile.free-threaded \
            --build-arg "BUILD_COMMIT=$BUILD_COMMIT" \
            --build-arg "BUILD_NUMBER=$BUILD_NUMBER" \
            --tag "$repository:${tags[0]}" \
            .

          printf '%s' "$REGISTRY_TOKEN" | buildah login --username "$REGISTRY_USER" --password-stdin "$REGISTRY"
          for tag in "${tags[@]}"; do
            buildah push "$repository:${tags[0]}" "docker://$repository:$tag"
            echo "Pushed $repository:$tag"
          done
          buildah logout "$REGISTRY"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-push-images]
    runs-on: node
    steps:
      - name: Install git
        run: |
          # Without git on PATH, checkout downloads a snapshot without history.
          if ! command -v git >/dev/null; then
            for i in {1..3}; do apt-get -qq update && break || sleep 5; done
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -qq -y git ca-certificates
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RUNNER_PACKAGE_PUSH_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure Git
        run: |
          git config --global user.name "Gitea Actions"
          git config --global user.email "actions@gitea.io"

      - name: Set version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate CHANGELOG.md with git-cliff
        run: |
          uv run git-cliff --tag ${{ steps.version.outputs.TAG }} -o CHANGELOG.md
          echo "--- Preview (last 40 lines) ---"
          tail -40 CHANGELOG.md

      - name: Extract release notes for this version
        id: release_notes
        run: |
          NOTES=$(uv run git-cliff --tag ${{ steps.version.outputs.TAG }} --unreleased --strip all 2>/dev/null || uv run git-cliff --latest --strip all)
          echo "NOTES<<HEREDOC" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "HEREDOC" >> $GITHUB_OUTPUT

      - name: Install HTTP tools
        run: |
          # The runner image is not guaranteed to ship these tools.
          if ! command -v curl >/dev/null || ! command -v jq >/dev/null; then
            for i in {1..3}; do apt-get -qq update && break || sleep 5; done
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -qq -y ca-certificates curl jq
          fi
      - name: Create Forgejo Release
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.RUNNER_PACKAGE_PUSH_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://${{ vars.RUNNER_PACKAGE_PUSH_HOST }}/api/v1/repos/${{ vars.RUNNER_PACKAGE_PUSH_USER }}/dtvp/releases" \
            -d "$(jq -n \
              --arg tag "${{ steps.version.outputs.TAG }}" \
              --arg name "Release ${{ steps.version.outputs.TAG }}" \
              --arg body "${{ steps.release_notes.outputs.NOTES }}" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}'\
            )"

  delete-pr-images:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: node
    steps:
      - name: Install HTTP tools
        run: |
          # The runner image is not guaranteed to ship these tools.
          if ! command -v curl >/dev/null || ! command -v jq >/dev/null; then
            for i in {1..3}; do apt-get -qq update && break || sleep 5; done
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -qq -y ca-certificates curl jq
          fi
      - name: Delete PR Image Tag
        run: |-
          VERSION="pr-${{ github.event.pull_request.number }}"
          echo "Deleting version $VERSION for dtvp"
          curl -fsS -X DELETE \
            -H "Authorization: token ${{ secrets.RUNNER_PACKAGE_PUSH_TOKEN }}" \
            "https://${{ vars.RUNNER_PACKAGE_PUSH_HOST }}/api/v1/packages/${{ vars.RUNNER_PACKAGE_PUSH_USER }}/container/dtvp/$VERSION" || true
