[project]
name = "dtvp"
version = "2.0.0"
description = "Owned SBOM inventory, security evidence, and review coordination"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "authlib>=1.8,<2",
  "joserfc>=1,<2",
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<1",
  "itsdangerous>=2.2,<3",
  "cvss>=3.6,<4",
  "defusedxml>=0.7,<1",
  "packageurl-python>=0.17,<1",
  "cyclonedx-python-lib[json-validation]>=11.7,<12",
]

[dependency-groups]
dev = ["pytest>=9,<10", "respx>=0.22,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["postgres: requires DTVP_TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
