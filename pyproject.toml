[project]
name = "dtvp"
version = "1.0.25"
authors = ["phbaer <git@ph.baer.one>"]
urls = { "Homepage" = "https://baer.one", "Main repo" = "https://git.baer.one/phbaer/dtvp", "GitHub" = "https://github.com/phbaer/dtvp", "Mastodon" = "https://baer.im/@phbaer" }
description = "A vulnerability management platform for dependency track"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "httpx2>=2.0.0,<3",
    "python-jose[cryptography]",
    "pydantic-settings",
    "python-multipart",
    "cvss>=3.6",
    "authlib>=1.8.0,<2",
    "itsdangerous>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg>=3.2,<4",
    "alembic>=1.16,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[c]>=3.2,<4"]

[project.scripts]
dtvp-db-upgrade = "dtvp.database_migrations:main"
dtvp-legacy-cache-migrate = "dtvp.legacy_cache_migration:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "git-cliff>=2.7.0",
    "cyclonedx-bom>=7.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = "."
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=. --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
omit = [
    "tests/*",
    "agentyzer/*",
    "reproduce_issue.py",
    "debug_finding.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
