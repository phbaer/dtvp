name: dtvp
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: dtvp
      POSTGRES_USER: dtvp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: ["database:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtvp -d dtvp"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: .
    image: dtvp:rewrite
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["artifacts:/data"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  worker:
    image: dtvp:rewrite
    env_file: .env
    command: ["uv", "run", "--no-sync", "python", "-m", "dtvp.cli", "worker"]
    volumes: ["artifacts:/data"]
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  database:
  artifacts:
