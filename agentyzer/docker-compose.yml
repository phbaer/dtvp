version: '3.8'
services:
  analyzer:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AGENTYZER_CONFIG_DIR=/app/config
      - AGENTYZER_REPOS_DIR=/app/repos
      - AGENTYZER_MAX_CONCURRENT_JOBS=1
      - AGENTYZER_GITHUB_TOKEN=${AGENTYZER_GITHUB_TOKEN:-}
      - AGENTYZER_REPO_REFRESH_SECONDS=${AGENTYZER_REPO_REFRESH_SECONDS:-900}
      - AGENTYZER_RESEARCH_CLONE_ENABLED=true
      - AGENTYZER_RESEARCH_GIT_HOSTS=github.com,gitlab.com,bitbucket.org
      - AGENTYZER_RESEARCH_MAX_CLONES_PER_ANALYSIS=3
      - AGENTYZER_RESEARCH_CLONE_TIMEOUT_SECONDS=90
      - AGENTYZER_RESEARCH_CLONE_MAX_REPOSITORY_MB=256
      - AGENTYZER_RESEARCH_CLONE_MAX_FILE_BYTES=256000
      - AGENTYZER_RESEARCH_CLONE_CACHE_TTL_SECONDS=3600
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral
      - OPENWEBUI_CONTEXT_WINDOW=0
      - OPENWEBUI_CONTEXT_SAFETY_MARGIN=256
      - OPENWEBUI_CONTEXT_RETRIES=2
      - OPENWEBUI_MIN_COMPLETION_TOKENS=256
    volumes:
      - ./config:/app/config:ro
      - agentyzer-repos:/app/repos

volumes:
  agentyzer-repos:
